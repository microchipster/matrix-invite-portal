---

- name: Fail if required Matrix Invite Portal settings are not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`) for using Matrix Invite Portal.
  when: "lookup('vars', item, default='') | string | trim | length == 0"
  with_items:
    - matrix_invite_portal_admin_token
    - matrix_invite_portal_synapse_registration_shared_secret

- when: matrix_invite_portal_container_labels_traefik_enabled | bool
  block:
    - name: Fail if required Matrix Invite Portal Traefik settings are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | trim | length == 0"
      with_items:
        - matrix_invite_portal_container_labels_traefik_hostname

    - name: Fail if Matrix Invite Portal hostname ends with a slash
      ansible.builtin.fail:
        msg: >-
          matrix_invite_portal_container_labels_traefik_hostname (`{{ matrix_invite_portal_container_labels_traefik_hostname }}`) must not end with a slash.
      when: "matrix_invite_portal_container_labels_traefik_hostname[-1] == '/'"
