---

- name: Ensure Matrix Invite Portal paths exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0750'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  with_items:
    - {path: "{{ matrix_invite_portal_base_path }}", when: true}
    - {path: "{{ matrix_invite_portal_config_path }}", when: true}
    - {path: "{{ matrix_invite_portal_data_path }}", when: true}
  when: "item.when | bool"

- name: Prepare role-scoped Docker cleanup
  ansible.builtin.include_role:
    name: custom/matrix-common-after
    tasks_from: prepare_role_docker_cleanup.yml
  vars:
    matrix_role_docker_cleanup_command: "{{ devture_systemd_docker_base_host_command_docker }}"
    matrix_role_docker_cleanup_image: "{{ matrix_invite_portal_container_image }}"
    matrix_role_docker_cleanup_container_name: "{{ matrix_invite_portal_container_name }}"

- name: Ensure Matrix Invite Portal source checkout starts clean on self-build
  # This directory is only a disposable git checkout for building the image.
  ansible.builtin.file:
    path: "{{ matrix_invite_portal_container_src_files_path }}"
    state: absent
  when: "matrix_invite_portal_container_image_self_build | bool"

- name: Ensure Matrix Invite Portal image is pulled
  community.docker.docker_image_pull:
    name: "{{ matrix_invite_portal_container_image }}"
    pull: always
  when: "not matrix_invite_portal_container_image_self_build | bool"
  register: matrix_invite_portal_container_image_pull_result
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: matrix_invite_portal_container_image_pull_result is not failed

- name: Ensure Matrix Invite Portal repository is present on self-build
  ansible.builtin.git:
    repo: "{{ matrix_invite_portal_container_image_self_build_repo }}"
    version: "{{ matrix_invite_portal_container_image_self_build_repo_version }}"
    dest: "{{ matrix_invite_portal_container_src_files_path }}"
    force: "yes"
  become: true
  become_user: "{{ matrix_user_name }}"
  register: matrix_invite_portal_git_pull_results
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: matrix_invite_portal_git_pull_results is not failed
  when: "matrix_invite_portal_container_image_self_build | bool"

- name: Ensure Matrix Invite Portal Docker image is built
  community.docker.docker_image_build:
    name: "{{ matrix_invite_portal_container_image }}"
    path: "{{ matrix_invite_portal_container_src_files_path }}"
    dockerfile: Dockerfile
    pull: true
    rebuild: "{{ 'always' if matrix_invite_portal_git_pull_results.changed | bool else 'never' }}"
  register: matrix_invite_portal_container_image_build_result
  when: "matrix_invite_portal_container_image_self_build | bool"

- name: Check if Matrix Invite Portal Docker image exists
  community.docker.docker_image_info:
    name: "{{ matrix_invite_portal_container_image }}"
  register: matrix_invite_portal_container_image_info
  when: "matrix_invite_portal_container_image_self_build | bool"

- name: Fail if Matrix Invite Portal Docker image does not exist
  ansible.builtin.fail:
    msg: "The Matrix Invite Portal Docker image {{ matrix_invite_portal_container_image }} does not exist. Please check build logs."
  when:
    - matrix_invite_portal_container_image_self_build | bool
    - matrix_invite_portal_container_image_info.images | length == 0

- name: Ensure Matrix Invite Portal env file installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/env.j2"
    dest: "{{ matrix_invite_portal_config_env_file }}"
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
    mode: '0640'
  register: matrix_invite_portal_env_result

- name: Ensure Matrix Invite Portal support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ matrix_invite_portal_base_path }}/{{ item }}"
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
    mode: '0640'
  with_items:
    - labels
  register: matrix_invite_portal_support_files_result

- name: Ensure Matrix Invite Portal container network is created
  community.general.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ matrix_invite_portal_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"

- name: Ensure Matrix Invite Portal systemd service is installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/matrix-invite-portal.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ matrix_invite_portal_systemd_service_name }}"
    mode: '0644'
  register: matrix_invite_portal_systemd_service_result

- name: Determine whether Matrix Invite Portal needs a restart
  ansible.builtin.set_fact:
    matrix_invite_portal_restart_necessary: >-
      {{
        (matrix_invite_portal_container_image_pull_result.changed if matrix_invite_portal_container_image_pull_result is defined else false)
        or (matrix_invite_portal_git_pull_results.changed if matrix_invite_portal_git_pull_results is defined else false)
        or (matrix_invite_portal_env_result.changed if matrix_invite_portal_env_result is defined else false)
        or (matrix_invite_portal_support_files_result.changed if matrix_invite_portal_support_files_result is defined else false)
        or (matrix_invite_portal_systemd_service_result.changed if matrix_invite_portal_systemd_service_result is defined else false)
        or (matrix_invite_portal_container_image_build_result.changed if matrix_invite_portal_container_image_build_result is defined else false)
      }}

# The shared systemd_service_manager role (running near the end of the play)
# restarts services whose `restart_necessary` flag is set, retrying transient
# failures. This task only makes sure the service is enabled and running right
# after installation. The fact computed above is consumed by
# `devture_systemd_service_manager_services_list_auto` in group_vars.
- name: Ensure matrix-invite-portal.service enabled and running
  ansible.builtin.service:
    name: "{{ matrix_invite_portal_systemd_service_name }}"
    enabled: true
    daemon_reload: true
    state: started

- name: Finish role-scoped Docker cleanup
  ansible.builtin.include_role:
    name: custom/matrix-common-after
    tasks_from: finish_role_docker_cleanup.yml
  vars:
    matrix_role_docker_cleanup_command: "{{ devture_systemd_docker_base_host_command_docker }}"
    matrix_role_docker_cleanup_image: "{{ matrix_invite_portal_container_image }}"
    matrix_role_docker_cleanup_container_name: "{{ matrix_invite_portal_container_name }}"
    matrix_role_docker_cleanup_restart_necessary: >-
      {{
        (matrix_invite_portal_container_image_pull_result is defined and matrix_invite_portal_container_image_pull_result.changed | bool)
        or (matrix_invite_portal_container_image_build_result is defined and matrix_invite_portal_container_image_build_result.changed | bool)
      }}
