[package]
name = "matrix-invite-portal"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
htmlescape = "0.3"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
hex = "0.4"

[profile.release]
strip = true
lto = "thin"
